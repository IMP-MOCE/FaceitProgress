services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: faceit
      POSTGRES_PASSWORD: faceit
      POSTGRES_DB: faceit
    ports:
      # 15432 на хосте: 5432–5433 часто заняты
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Создаёт отдельную базу faceit_test для pytest
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faceit -d faceit"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://faceit:faceit@db:5432/faceit
      # Значение по умолчанию для локального запуска. в .env - свой секрет
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-0123456789abcdef}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
