# Те же проверки, что в CI, но до коммита. Установка: pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: openapi
        name: docs/openapi.json актуален
        entry: python scripts/export_openapi.py
        language: system
        files: ^app/
        pass_filenames: false
