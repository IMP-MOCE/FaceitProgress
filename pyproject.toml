[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "faceit-progress-api"
version = "0.1.0"
description = "Backend FACEIT Progress: аналитика игроков FACEIT в CS2"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "sqlalchemy>=2.1,<3",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic[email]>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "pyjwt>=2.10,<3",
    "argon2-cffi>=23.1",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
    "pip-audit>=2.7",
    "pre-commit>=4.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# E/F — pycodestyle/pyflakes, I — сортировка импортов, B — bugbear,
# UP — современный синтаксис, S — bandit (безопасность), SIM, RUF.
select = ["E", "F", "I", "B", "UP", "S", "N", "SIM", "RUF"]
# B008: Depends(...) в аргументах по умолчанию — штатный приём FastAPI.
# RUF001–003: кириллица в строках и комментариях — ожидаемо для русскоязычного проекта.
# N818: HTTP-ошибки названы по смыслу ответа (NotFound, Conflict), без суффикса Error.
ignore = ["B008", "RUF001", "RUF002", "RUF003", "N818"]

[tool.ruff.lint.isort]
# Каталог alembic/ с миграциями не должен делать пакет alembic «своим».
known-third-party = ["alembic"]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[[tool.mypy.overrides]]
module = ["respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
