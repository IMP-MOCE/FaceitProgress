name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Линтеры и типы
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff (стиль, ошибки, правила безопасности bandit)
        run: ruff check . --output-format github
      - name: ruff format
        run: ruff format --check .
      - name: mypy (strict)
        run: mypy
      - name: pip-audit (уязвимые зависимости, OWASP A06)
        run: pip-audit --skip-editable

  test:
    name: Тесты
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: faceit
          POSTGRES_PASSWORD: faceit
          POSTGRES_DB: faceit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faceit"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://faceit:faceit@localhost:5432/faceit_test
      # Секрет только для тестового прогона, в production не используется.
      JWT_SECRET: ci-test-secret-not-for-production-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: pytest + покрытие
        run: >-
          pytest
          --cov=app --cov-report=term-missing --cov-report=xml:reports/coverage.xml
          --cov-fail-under=85
          --junitxml=reports/junit.xml
      - name: Отчёт о тестах в сводке прогона
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          suite = ET.parse("reports/junit.xml").getroot()
          suite = suite if suite.tag == "testsuite" else suite[0]
          cov = ET.parse("reports/coverage.xml").getroot()
          print("| Тестов | Провалено | Ошибок | Пропущено | Время, с | Покрытие строк |")
          print("|---|---|---|---|---|---|")
          print(f"| {suite.get('tests')} | {suite.get('failures')} | {suite.get('errors')} "
                f"| {suite.get('skipped')} | {float(suite.get('time')):.1f} "
                f"| {float(cov.get('line-rate')) * 100:.1f}% |")
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: reports/

  docker:
    name: Сборка образа
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Вход в GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # На pull request образ только собирается; публикуется после слияния в main.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
